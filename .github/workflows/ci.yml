name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      # Prove installers before promotion to main; ordinary dev checks retain no artifacts.
      installers: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.event_name == 'workflow_dispatch' }}
  gate:
    name: CI passed
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every native check to pass
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
