plugins {
    id 'com.android.application'
}

def phoenixVersion = new groovy.json.JsonSlurper().parse(file('../../../package.json')).version
def versionParts = phoenixVersion.tokenize('.').collect { it.toInteger() }

android {
    namespace 'io.github.judus.phoenix'
    compileSdk 36
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'io.github.judus.phoenix'
        minSdk 30
        targetSdk 36
        versionCode versionParts[0] * 1000000 + versionParts[1] * 1000 + versionParts[2]
        versionName phoenixVersion
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-dev'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
